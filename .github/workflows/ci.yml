# ==============================================================================
# Pipeline de Integração Contínua (CI) - Sistema de Gestão de Eventos
# ==============================================================================
#
# Autor: DevOps Engineer
# Descrição: Esta pipeline executa em paralelo testes, linter e build para o
#            frontend e o backend sempre que houver commits ou pull requests
#            direcionados para as branches principais (main e develop).
#
# ==============================================================================

name: Continuous Integration

# Gatilhos de execução (Triggers)
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ============================================================================
  # JOB: CI do Backend
  # ============================================================================
  backend-ci:
    name: Backend CI (Node/Express/TS)
    runs-on: ubuntu-latest

    # Define o diretório padrão de execução de todas as etapas deste job
    defaults:
      run:
        working-directory: backend

    steps:
      # 1. Checkout do código-fonte
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          description: "Baixa o código-fonte do repositório para o runner"

      # 2. Configuração do ambiente Node.js com cache do npm
      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 3. Instalação limpa e determinística das dependências
      - name: Install dependencies (Clean Install)
        run: npm ci --legacy-peer-deps

      # 4. Checagem de qualidade do código com ESLint
      - name: Run Linter
        run: npm run lint

      # 5. Validação da compilação do TypeScript
      - name: Build and compile TypeScript
        run: npm run build

      # 6. Execução de testes unitários (não dependentes do MongoDB)
      - name: Run Unit Tests
        run: npm run test

  # ============================================================================
  # JOB: CI do Frontend
  # ============================================================================
  frontend-ci:
    name: Frontend CI (React/Vite/TS)
    runs-on: ubuntu-latest

    # Define o diretório padrão de execução de todas as etapas deste job
    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Checkout do código-fonte
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          description: "Baixa o código-fonte do repositório para o runner"

      # 2. Configuração do ambiente Node.js com cache do npm
      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalação limpa e determinística das dependências
      - name: Install dependencies (Clean Install)
        run: npm ci --legacy-peer-deps

      # 4. Checagem de qualidade do código com ESLint
      - name: Run Linter
        run: npm run lint

      # 5. Validação da compilação do TypeScript e empacotamento com Vite
      - name: Build frontend production bundle
        run: npm run build

      # 6. Execução de testes unitários com Vitest
      - name: Run Unit Tests
        run: npm run test

  # ============================================================================
  # JOB: CI do Agente IA (Python)
  # ============================================================================
  agent-ci:
    name: Agent CI (Python/LangGraph)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run Linter (flake8)
        run: |
          # Quebra a build em erros graves
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Considera os warnings como apenas informativos
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Integration Tests (pytest)
        env:
          GOOGLE_API_KEY: "dummy-key-for-tests"
        run: pytest tests/ -v
